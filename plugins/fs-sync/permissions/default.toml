  "allow-attachment-remove",
  "allow-attachment-save",
  "allow-audio-delete",
  "allow-audio-exist",
  "allow-audio-import",
  "allow-audio-path",
  "allow-audio-source-metadata",
  "allow-chat-dir",
  "allow-create-folder",
  "allow-delete-folder",
  "allow-delete-session-folder",
  "allow-deserialize",
  "allow-entity-dir",
  "allow-list-folders",
  "allow-load-session-content",
