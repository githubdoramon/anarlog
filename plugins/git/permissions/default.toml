"$schema" = "schemas/schema.json"

[default]
description = "Default permissions for git commands."
permissions = [
  "allow-abort-merge",
  "allow-add",
  "allow-add-remote",
  "allow-check-conflicts",
  "allow-commit",
  "allow-fetch",
  "allow-get-current-branch",
  "allow-init",
  "allow-is-repo",
  "allow-list-remotes",
  "allow-log",
  "allow-pull",
  "allow-push",
  "allow-reset",
  "allow-status",
]
